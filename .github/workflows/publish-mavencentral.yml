name: Publish to Maven Central on Release

on:
  release:
    types: [published]

jobs:
  # ── Step 1: build the JNI .so/.dylib/.dll on each platform ─────────────────
  build-native:
    name: Build native JNI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # CI-safe overrides (repo gradle.properties requests -Xms24g/-Xmx24g, more than runners have)
      - name: Configure CI Gradle JVM args
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
          org.gradle.configuration-cache=false
          EOF

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake
          cmake --version

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cmake --version

      - name: Install Windows deps (cmake + ninja)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja -y
          refreshenv
          cmake --version
          ninja --version

      - name: Resolve Windows cmake path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\CMake\bin\cmake.exe",
            "C:\ProgramData\chocolatey\bin\cmake.exe"
          )
          $cmake = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $cmake = $c; break }
          }
          if (-not $cmake) {
            $cmake = (where.exe cmake 2>$null | Select-Object -First 1)
          }
          if (-not $cmake) { Write-Error "cmake not found"; exit 1 }
          "CMAKE_PATH=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $cmake --version

      - name: Build desktop JNI library
        shell: bash
        run: ./gradlew :core:copyDesktopJniToResources --no-daemon --stacktrace

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: core/build/generated/native-resources/native/${{ matrix.platform }}/
          if-no-files-found: error

  # ── Step 2: publish — macOS runner assembles all three natives into the JAR ─
  publish:
    name: Publish to Maven Central
    needs: build-native
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Debug tree
        run: |
          git submodule status --recursive || true
          ls -la
          ls -la llama.cpp || true
          find . -maxdepth 3 -type d -name "llama.cpp" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          brew update
          brew install cmake
          cmake --version

      # ---------- Download pre-built natives from all platforms ----------
      - name: Download macOS native
        uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: core/build/generated/native-resources/native/macos/

      - name: Download Linux native
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: core/build/generated/native-resources/native/linux/

      - name: Download Windows native
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: core/build/generated/native-resources/native/windows/

      # Regenerate native-libs.txt for each platform from the downloaded files
      - name: Regenerate native-libs.txt for all platforms
        run: |
          for platform in macos linux windows; do
            dir="core/build/generated/native-resources/native/$platform"
            if [ -d "$dir" ]; then
              ls "$dir" | grep -v native-libs.txt | sort > "$dir/native-libs.txt"
              echo "=== $platform ==="
              cat "$dir/native-libs.txt"
            fi
          done

      - name: Verify all three platforms are present
        run: |
          for platform in macos linux windows; do
            dir="core/build/generated/native-resources/native/$platform"
            count=$(find "$dir" -type f ! -name native-libs.txt 2>/dev/null | wc -l | tr -d ' ')
            if [ "$count" -eq 0 ]; then
              echo "ERROR: No native library found for $platform in $dir"
              exit 1
            fi
            echo "$platform: $count file(s)"
          done

      # ---------- Emscripten (WASM) toolchain ----------
      - name: Cache emsdk + emscripten cache
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: |
            ~/emsdk
            ~/.emscripten_cache
          key: emsdk-${{ runner.os }}-3.1.68

      - name: Install emsdk (Emscripten)
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install 3.1.68

      - name: Activate emsdk + export PATH
        run: |
          set -euxo pipefail
          cd ~/emsdk
          ./emsdk activate 3.1.68

          chmod +x ~/emsdk/upstream/emscripten/emcmake || true
          chmod +x ~/emsdk/upstream/emscripten/emmake || true
          chmod +x ~/emsdk/upstream/emscripten/emcc || true

          echo "EMSDK=$HOME/emsdk" >> $GITHUB_ENV
          echo "EM_CACHE=$HOME/.emscripten_cache" >> $GITHUB_ENV
          mkdir -p "$HOME/.emscripten_cache"

          echo "$HOME/emsdk/upstream/emscripten" >> $GITHUB_PATH
          echo "$HOME/emsdk/upstream/bin" >> $GITHUB_PATH

          NODE_BIN="$(ls -d $HOME/emsdk/node/*/bin | head -n1 || true)"
          if [ -n "$NODE_BIN" ]; then
            echo "$NODE_BIN" >> $GITHUB_PATH
          fi

      - name: Sanity check emsdk tools
        run: |
          set -euxo pipefail
          command -v emcmake
          command -v emmake
          command -v emcc
          emcc -v

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version from tag
        id: v
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
          VERSION="${RAW_REF#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ---------- Build Android release AAR and inspect it BEFORE publishing ----------
      - name: Assemble Android Release (:core)
        run: ./gradlew :core:assembleRelease

      - name: Inspect :core AAR (classes / JNI / assets)
        run: |
          echo "Listing AAR outputs:"
          ls -la core/build/outputs/aar || true

          AAR=$(ls -1 core/build/outputs/aar/*-release.aar | head -n1 || true)
          echo "AAR=$AAR"

          if [ -z "$AAR" ] || [ ! -f "$AAR" ]; then
            echo "ERROR: AAR not found for :core"
            exit 1
          fi

          mkdir -p /tmp/aar
          unzip -q "$AAR" -d /tmp/aar

          echo "== AAR tree (top) =="
          find /tmp/aar -maxdepth 2 -type d -print

          echo "== classes.jar (first 200 entries) =="
          jar tf /tmp/aar/classes.jar | sed -n '1,200p'

          echo "== JNI libs (if any) =="
          find /tmp/aar/jni -maxdepth 3 -type f || true

          echo "== Sanity checks =="
          jar tf /tmp/aar/classes.jar | grep -E "com/llamatik/.*(platform|core)" >/dev/null \
            || (echo "ERROR: Android classes missing in AAR (androidMain not published)" && exit 1)

          if [ -d /tmp/aar/jni ]; then
            find /tmp/aar/jni -type f | grep arm64-v8a >/dev/null \
              || (echo "ERROR: arm64-v8a .so missing in AAR" && exit 1)
          fi

      # Tell Gradle to skip the native build steps — natives are already in place
      # from the download steps above. jvmProcessResources will pick them up via
      # the generatedNativeResourcesDir source set.
      - name: Verify JVM JAR includes all three platform natives
        run: |
          ./gradlew :core:jvmJar --no-daemon --stacktrace
          JAR=$(find core/build/libs -name "core-jvm-*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
          echo "Inspecting $JAR"
          unzip -l "$JAR" | grep "native/" || true
          for platform in macos linux windows; do
            count=$(unzip -l "$JAR" | grep "native/$platform/" | grep -v '/$' | wc -l | tr -d ' ')
            echo "$platform: $count native file(s) in JAR"
            if [ "$count" -eq 0 ]; then
              echo "ERROR: $platform native library missing from JVM JAR"
              exit 1
            fi
          done

      # ---------- Publish to Sonatype ----------
      - name: Publish to Sonatype (staging + release)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
          EMSDK: ${{ env.EMSDK }}
          EM_CACHE: ${{ env.EM_CACHE }}
        run: |
          ./gradlew \
            -Pversion=${RELEASE_VERSION} \
            publishToSonatype \
            closeAndReleaseSonatypeStagingRepository
