{{ if hugo.IsMultilingual }}
{{ if gt (len .AllTranslations) 1 }}
<div class="language-selector">
    <select onchange="var u=String(this.value||'');if(/^\/(?!\/)/.test(u)){window.location.assign(u);}" aria-label="Select language">
        {{ range .AllTranslations }}
        <option value="{{ .RelPermalink }}" {{ if eq .Language.Lang $.Language.Lang }}selected{{ end }}>
            {{ .Language.LanguageName }}
        </option>
        {{ end }}
    </select>
</div>
{{ end }}
{{ end }}
