{{ if hugo.IsMultilingual }}
{{ if gt (len .AllTranslations) 1 }}
<div class="language-selector">
    <select onchange="var u=String(this.value||'');if(u.startsWith('/')&&!u.startsWith('//')){var p=new URL(u,window.location.origin);if(p.origin===window.location.origin){window.location.href=p.pathname+p.search+p.hash;}}" aria-label="Select language">
        {{ range .AllTranslations }}
        <option value="{{ .RelPermalink }}" {{ if eq .Language.Lang $.Language.Lang }}selected{{ end }}>
            {{ .Language.LanguageName }}
        </option>
        {{ end }}
    </select>
</div>
{{ end }}
{{ end }}
