# ---------- server ----------
srv_eyebrow: "Llamatik Server"
srv_title: "Votre propre backend d'inférence.<br><g>Même API. Zéro changement de code.</g>"
srv_lead: "Besoin de plus de puissance qu'un téléphone ? Auto-hébergez un serveur Ktor qui parle exactement la même API que la bibliothèque — texte, embeddings, voix, images, <b>vidéo</b> et vision, en streaming via SSE."
srv_t1: "Parité complète avec <code>LlamaBridge</code>, <code>WhisperBridge</code>, <code>StableDiffusionBridge</code> et <code>MultimodalBridge</code>"
srv_t2: "JSON contraint par schéma, sessions KV, décodage spéculatif, déport sur GPU"
srv_t3: "Authentification JWT, profils, prêt pour Docker — ou intégrez <code>com.llamatik:server</code> dans votre propre app"
