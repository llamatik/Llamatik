# ---------- features ----------
f_eyebrow: "Ce qu'elle fait"
f_title: "Bien plus qu'un chatbot.<br><g>Un studio d'IA complet dans votre poche.</g>"
f_lead: "Texte, vision, voix, images, vidéo et documents — chacun propulsé par le moteur en qui vous avez déjà confiance, sur le matériel que vous possédez déjà."
f_new: "nouveau"
f_chat_tag: "Chat"
f_chat_t: "Des conversations rapides, en streaming"
f_chat_d: "Choisissez n'importe quel modèle GGUF — téléchargez-le depuis le catalogue intégré ou chargez un fichier de votre appareil. Markdown, blocs de code et historique inclus."
f_chat_q: "Explique-moi les coroutines Kotlin comme si j'avais cinq ans."
f_chat_a: "Imagine une coroutine comme un jouet qui peut faire pause et reprendre. Il s'arrête quand il doit attendre — par exemple pour un goûter — puis repart exactement là où il s'était arrêté, et personne d'autre n'a besoin de rester immobile."
f_vision_tag: "Vision"
f_vision_t: "Montrez-lui une image"
f_vision_d: "Posez des questions sur des photos, des captures d'écran et des documents avec des modèles de vision embarqués comme SmolVLM."
f_vision_box1: "reçu"
f_vision_box2: "total : 42,10"
f_voice_tag: "Voix"
f_voice_t: "Parlez, n'écrivez pas"
f_voice_d: "Whisper transcrit la parole hors ligne — avec horodatage, traduction vers l'anglais et tours de parole."
f_video_tag: "Vidéo"
f_video_t: "Texte vers vidéo, sur votre matériel"
f_video_d: "Décrivez une scène et obtenez un court clip — encodé en H.264, enregistré dans votre galerie, avec upscaling embarqué en option."
f_image_tag: "Images"
f_image_t: "Générez de l'art hors ligne"
f_image_d: "Texte vers image et image vers image, avec progression en direct et guidage ControlNet pour la pose, la profondeur et les contours."
f_agent_tag: "Agents"
f_agent_t: "Un assistant qui agit"
f_agent_d: "Planificateur, outils, permissions et journal d'audit — avec des personas de compagnon, de Professionnel à Animal."
f_rag_tag: "Documents"
f_rag_t: "Discutez avec vos PDF"
f_rag_d: "RAG local : découpage, embeddings et récupération MMR — vos fichiers ne sont jamais envoyés."
f_fast_tag: "Vitesse"
f_fast_t: "Prédiction multi-tokens"
f_fast_d: "Rédaction spéculative pour les modèles compatibles (Qwen3.5, GLM-4) — plus de tokens par seconde."
f_priv_tag: "Confidentialité"
f_priv_t: "Hors ligne par défaut"
f_priv_d: "Modèles et chats restent sur votre appareil. Sans compte, sans publicité, avec des diagnostics facultatifs désactivés par défaut, et un avertissement clair avant toute connexion à un serveur."

# ---------- share this device ----------
net_eyebrow: "Partager cet appareil"
net_pill: "nouveau en 2.0"
net_title: "Tous vos appareils,<br><g>un seul cerveau partagé.</g>"
net_lead: "Votre PC de jeu a la puissance. Votre téléphone, c'est vous. Activez <b>Partager cet appareil</b> et Llamatik sert vos modèles chargés à vos autres appareils via le réseau local — détectés automatiquement avec mDNS."
net_t1: "<b>Approuvez chaque appareil</b> avant qu'il puisse utiliser le vôtre — aucun secret partagé à voir fuiter."
net_t2: "<b>Détection automatique.</b> Les hôtes Llamatik à proximité apparaissent d'eux-mêmes."
net_t3: "<b>Streaming résilient.</b> Perdez le Wi-Fi en pleine réponse : la connexion reprend et continue."
net_t4: "<b>Android, bureau et iOS</b> peuvent héberger. Votre batterie vous remercie."
net_warn: "Les connexions entre appareils sont actuellement en HTTP simple — gardez-les sur des réseaux de confiance."
