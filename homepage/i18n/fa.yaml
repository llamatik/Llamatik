# ---------- why local-first ----------
why_eyebrow: "چرا اجرای محلی"
why_title: "هوش مصنوعی شما. داده‌های شما. <g>قوانین شما.</g>"
why1_t: "خصوصی از بنیاد"
why1_d: "پرسش‌ها، اسناد و صدا روی سخت‌افزار شما پردازش می‌شوند. نه حسابی برای ساختن هست و نه ابری برای اعتماد کردن."
why2_t: "همه‌جا کار می‌کند"
why2_d: "در هواپیما، در زیرزمین، پشت فایروال. وقتی مدلی دانلود شد، شبکه اختیاری است."
why3_t: "متن‌باز"
why3_d: "با مجوز MIT و در فضای باز ساخته شده. بررسی‌اش کنید، فورکش کنید، منتشرش کنید. برنده <k>گرنت Kotlin Foundation در 2026</k>."

