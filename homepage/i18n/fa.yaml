# ---------- server ----------
srv_eyebrow: "Llamatik Server"
srv_title: "بک‌اند استنتاج اختصاصی شما.<br><g>همان API. بدون تغییر در کد.</g>"
srv_lead: "قدرت بیشتری از یک گوشی لازم دارید؟ یک سرور Ktor خودمیزبان راه بیندازید که دقیقاً همان API کتابخانه را ارائه می‌دهد — متن، بردارسازی، گفتار، تصویر، <b>ویدیو</b> و بینایی، با جریان SSE."
srv_t1: "برابری کامل با <code>LlamaBridge</code>، <code>WhisperBridge</code>، <code>StableDiffusionBridge</code> و <code>MultimodalBridge</code>"
srv_t2: "JSON مقید به اسکیما، نشست‌های KV، رمزگشایی حدسی، انتقال بار به GPU"
srv_t3: "احراز هویت JWT، پروفایل‌ها، آماده Docker — یا <code>com.llamatik:server</code> را در برنامه خودتان جاسازی کنید"
srv_get: "دریافت Llamatik Server"
srv_docs: "مستندات API"

