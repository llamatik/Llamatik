# ---------- meta ----------
meta_title: "Llamatik — هوش مصنوعی خصوصی که روی دستگاه شما اجرا می‌شود"
meta_desc: "با هوش مصنوعی‌ای که روی دستگاه‌های خودتان اجرا می‌شود گفت‌وگو کنید، ببینید، بشنوید و بسازید. برنامه‌های رایگان برای Android، iOS، macOS، Windows، Linux و مرورگر — به‌علاوه یک Kotlin SDK متن‌باز، یک سرور خودمیزبان و یک دستیار کدنویسی هوشمند برای IDE شما."
meta_og_desc: "گفت‌وگو، بینایی، صدا، تولید تصویر و ویدیو — روی دستگاه‌های خودتان. متن‌باز. بدون حساب کاربری. پرامپت‌های شما بدون اجازه‌ی خودتان هرگز از دستگاه بیرون نمی‌روند."
blog_meta_title: "وبلاگ"
blog_meta_desc: "به‌روزرسانی‌ها، یادداشت‌های انتشار و بررسی‌های عمیق درباره LLMهای روی دستگاه با رویکرد Kotlin."

