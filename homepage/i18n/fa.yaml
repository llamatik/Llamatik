# ---------- features ----------
f_eyebrow: "چه کار می‌کند"
f_title: "بیشتر از یک چت‌بات.<br><g>یک استودیوی کامل هوش مصنوعی در جیب شما.</g>"
f_lead: "متن، بینایی، صدا، تصویر، ویدیو و اسناد — هر کدام روی موتوری که از قبل به آن اعتماد دارید و روی سخت‌افزاری که از قبل دارید."
f_new: "جدید"
f_chat_tag: "چت"
f_chat_t: "گفت‌وگوی سریع و جاری"
f_chat_d: "هر مدل GGUF را انتخاب کنید — از فهرست داخلی دانلود کنید یا فایلی را از دستگاه بارگذاری کنید. Markdown، بلوک‌های کد و تاریخچه همراه است."
f_chat_q: "کوروتین‌های Kotlin را طوری توضیح بده که یک بچه پنج‌ساله بفهمد."
f_chat_a: "کوروتین را مثل اسباب‌بازی‌ای تصور کن که می‌تواند مکث کند و دوباره ادامه دهد. هر وقت باید صبر کند — مثلاً برای یک تنقلات — می‌ایستد و دقیقاً از همان جا ادامه می‌دهد، پس بقیه‌ی چیزها لازم نیست متوقف شوند."
f_vision_tag: "بینایی"
f_vision_t: "یک تصویر نشانش بدهید"
f_vision_d: "درباره عکس‌ها، اسکرین‌شات‌ها و اسناد با مدل‌های بینایی روی دستگاه مانند SmolVLM بپرسید."
