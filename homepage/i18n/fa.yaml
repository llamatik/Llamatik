f_image_t: "تولید هنر به‌صورت آفلاین"
f_image_d: "متن به تصویر و تصویر به تصویر، با پیشرفت زنده و هدایت ControlNet برای ژست، عمق و لبه‌ها."
f_agent_tag: "عامل‌ها"
f_agent_t: "دستیاری که عمل می‌کند"
f_agent_d: "برنامه‌ریز، ابزارها، مجوزها و گزارش ممیزی — با شخصیت‌های همراه از رسمی تا حیوان خانگی."
f_rag_tag: "اسناد"
