# ---------- why local-first ----------
why_eyebrow: "Warum local-first"
why_title: "Deine KI. Deine Daten. <g>Deine Regeln.</g>"
why1_t: "Privat by Design"
why1_d: "Prompts, Dokumente und Sprache werden auf deiner Hardware verarbeitet. Kein Konto nötig und keine Cloud, der du vertrauen musst."
why2_t: "Funktioniert überall"
why2_d: "Im Flugzeug, im Keller, hinter der Firewall. Sobald ein Modell geladen ist, ist das Netzwerk optional."
why3_t: "Open Source"
why3_d: "MIT-lizenziert und offen entwickelt. Anschauen, forken, ausliefern. Ausgezeichnet mit einem <k>Kotlin Foundation Grant 2026</k>."

