# ---------- server ----------
srv_eyebrow: "Llamatik Server"
srv_title: "Dein eigenes Inferenz-Backend.<br><g>Gleiche API. Null Codeänderungen.</g>"
srv_lead: "Brauchst du mehr Power als ein Handy? Hoste selbst einen Ktor-Server, der exakt dieselbe API spricht wie die Bibliothek — Text, Embeddings, Sprache, Bilder, <b>Video</b> und Vision, gestreamt per SSE."
srv_t1: "Volle Parität mit <code>LlamaBridge</code>, <code>WhisperBridge</code>, <code>StableDiffusionBridge</code> und <code>MultimodalBridge</code>"
srv_t2: "Schema-beschränktes JSON, KV-Sessions, spekulatives Decoding, GPU-Offload"
srv_t3: "JWT-Auth, Profile, Docker-ready — oder bette <code>com.llamatik:server</code> in deine eigene App ein"
