# ---------- features ----------
f_eyebrow: "Was sie kann"
f_title: "Mehr als ein Chatbot.<br><g>Ein ganzes KI-Studio in deiner Tasche.</g>"
f_lead: "Text, Vision, Sprache, Bilder, Video und Dokumente — jeweils auf der Engine, der du schon vertraust, und auf der Hardware, die du schon hast."
f_new: "neu"
f_chat_tag: "Chat"
f_chat_t: "Schnelle Streaming-Unterhaltungen"
f_chat_d: "Wähle ein beliebiges GGUF-Modell — lade es aus dem integrierten Katalog herunter oder öffne eine Datei von deinem Gerät. Markdown, Codeblöcke und Verlauf inklusive."
f_chat_q: "Erklär mir Kotlin-Coroutines, als wäre ich fünf."
f_chat_a: "Stell dir eine Coroutine als Spielzeug vor, das pausieren und weitermachen kann. Muss es warten — zum Beispiel auf einen Snack —, hält es an und macht genau dort weiter, wo es aufgehört hat. So muss nichts anderes stillstehen."
f_vision_tag: "Vision"
f_vision_t: "Zeig ihr ein Bild"
f_vision_d: "Stell Fragen zu Fotos, Screenshots und Dokumenten — mit On-Device-Visionsmodellen wie SmolVLM."
f_vision_box1: "Kassenbon"
f_vision_box2: "Summe: 42,10"
f_voice_tag: "Sprache"
f_voice_t: "Sprechen statt tippen"
f_voice_d: "Whisper transkribiert Sprache offline — mit Zeitstempeln, Übersetzung ins Englische und Sprecherwechseln."
f_video_tag: "Video"
f_video_t: "Text-zu-Video auf deiner Hardware"
f_video_d: "Beschreibe eine Szene und erhalte einen kurzen Clip — kodiert in H.264, in deiner Galerie gespeichert, optional mit On-Device-Upscaling."
f_image_tag: "Bilder"
f_image_t: "Kunst offline generieren"
f_image_d: "Text-zu-Bild und Bild-zu-Bild, mit Live-Fortschritt und ControlNet-Steuerung für Pose, Tiefe und Kanten."
f_agent_tag: "Agenten"
f_agent_t: "Ein Assistent, der handelt"
f_agent_d: "Planer, Tools, Berechtigungen und ein Audit-Protokoll — mit Begleiter-Personas von Professional bis Pet."
f_rag_tag: "Dokumente"
f_rag_t: "Chatte mit deinen PDFs"
f_rag_d: "Lokales RAG: Chunking, Embeddings und MMR-Retrieval — deine Dateien werden nie hochgeladen."
f_fast_tag: "Tempo"
f_fast_t: "Multi-Token-Vorhersage"
f_fast_d: "Spekulatives Drafting für unterstützte Modelle (Qwen3.5, GLM-4) — mehr Tokens pro Sekunde."
f_priv_tag: "Privatsphäre"
f_priv_t: "Standardmäßig offline"
f_priv_d: "Modelle und Chats bleiben auf deinem Gerät. Kein Konto, kein Tracking und eine klare Warnung, bevor du dich jemals mit einem Server verbindest."

# ---------- share this device ----------
net_eyebrow: "Gerät teilen"
net_pill: "neu in 2.0"
net_title: "Alle deine Geräte,<br><g>ein gemeinsames Gehirn.</g>"
net_lead: "Dein Gaming-PC hat die Power. Dein Handy hat dich. Aktiviere <b>Gerät teilen</b> und Llamatik stellt deine geladenen Modelle deinen anderen Geräten im lokalen Netzwerk bereit — automatisch gefunden per mDNS."
net_t1: "<b>Jedes Gerät bestätigen</b>, bevor es deins nutzen darf — keine geteilten Geheimnisse, die leaken können."
net_t2: "<b>Automatische Erkennung.</b> Llamatik-Hosts in der Nähe tauchen von selbst auf."
net_t3: "<b>Robustes Streaming.</b> Fällst du mitten in der Antwort aus dem Wi-Fi, verbindet es sich neu und macht weiter."
net_t4: "<b>Android, Desktop und iOS</b> können hosten. Dein Akku dankt es dir."
net_warn: "Verbindungen zwischen Geräten laufen derzeit über unverschlüsseltes HTTP — nutze sie nur in Netzwerken, denen du vertraust."
