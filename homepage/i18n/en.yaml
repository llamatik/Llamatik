mdl_ram_note: "Download sizes are the ones in the app's catalog, which can change over time. The memory figure is a rough guide to the free RAM a model needs while running; real use varies with your device and settings."
mdl_expect_t: "What to expect"
mdl_expect_d: "Models that fit on a phone are small. They answer fast and privately, but they make mistakes, know less about the world than cloud models and cannot search the web. Use them for drafting, summarizing, translating and brainstorming, and double-check important facts. Bigger models answer better but need more memory and storage."
mdl_byo_t: "Bring your own model"
mdl_byo_d: "The app can also import any GGUF chat model from your files or download one from a link, for example from Hugging Face. Larger models give better answers on laptops and desktops with plenty of RAM."
mdl_faq_t: "Questions about models"
mdl_q1: "Why is the first download large?"
mdl_a1: "The app does not bundle a model, so it stays small and you choose what to install. A model is downloaded once and stored on your device."
mdl_q2: "Do I need internet after downloading a model?"
mdl_a2: "No. After the download, chat, vision and voice run offline. You only need a connection to download models and updates."
mdl_q3: "Which model should I start with?"
mdl_a3: "On a phone, start with Gemma 3 270M or Gemma 3 1B. On a laptop, import a larger model from Hugging Face once you know what you want to use it for."
