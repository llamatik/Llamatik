mdl_meta_title: "Models — Llamatik"
mdl_eyebrow: "Models"
mdl_title: "Which model <g>should you pick?</g>"
mdl_lead: "A plain guide to the models you can run in Llamatik: how big they are, how much memory they need, and what each one is good for."
mdl_start_t: "Start here"
mdl_s1_t: "Any phone, fastest start"
mdl_s1_d: "Gemma 3 270M (292 MB) answers quickly even on older phones and is multilingual."
mdl_s2_t: "Everyday chat on a recent phone"
mdl_s2_d: "Gemma 3 1B (806 MB) is a good balance. For more depth in many languages, try Qwen 3 1.7B (1.8 GB)."
mdl_s3_t: "Understand photos and screenshots"
mdl_s3_d: "SmolVLM 500M (437 MB) describes images and reads the text in them. SmolVLM 256M (175 MB) is the lightest option."
mdl_s4_t: "Talk instead of typing"
mdl_s4_d: "Whisper Base q8_0 (82 MB) is a fast, accurate default. Whisper Small q8_0 (264 MB) copes better with accents and noise."
