# ---------- features ----------
f_eyebrow: "What it does"
f_title: "More than a chatbot.<br><g>A whole AI studio in your pocket.</g>"
f_lead: "Text, vision, voice, images, video and documents — each one running on the engine you already trust, on the hardware you already own."
f_new: "new"
f_chat_tag: "Chat"
f_chat_t: "Fast, streaming conversations"
f_chat_d: "Pick any GGUF model — download from the built-in catalog or load a file from your device. Markdown, code blocks and history included."
f_chat_q: "Explain Kotlin coroutines like I'm five."
f_chat_a: "Imagine a coroutine as a toy that can pause and resume. It stops when it needs to wait — like for a snack — and picks up exactly where it left off, so nothing else has to stand still."
f_vision_tag: "Vision"
f_vision_t: "Show it a picture"
f_vision_d: "Ask about photos, screenshots and documents with on-device vision models like SmolVLM."
f_vision_box1: "receipt"
f_vision_box2: "total: 42.10"
f_voice_tag: "Voice"
f_voice_t: "Talk, don't type"
f_voice_d: "Whisper transcribes speech offline — with timestamps, translation to English, and speaker turns."
f_video_tag: "Video"
f_video_t: "Text-to-video, on your hardware"
f_video_d: "Describe a scene and get a short clip — encoded to H.264, saved to your gallery, with optional on-device upscaling."
f_image_tag: "Images"
f_image_t: "Generate art offline"
f_image_d: "Text-to-image and image-to-image, with live progress and ControlNet guidance for pose, depth and edges."
f_agent_tag: "Agents"
f_agent_t: "An assistant that acts"
f_agent_d: "Planner, tools, permissions and an audit log — with companion personas from Professional to Pet."
f_rag_tag: "Documents"
f_rag_t: "Chat with your PDFs"
f_rag_d: "Local RAG: chunking, embeddings and MMR retrieval — your files never get uploaded."
f_fast_tag: "Speed"
f_fast_t: "Multi-token prediction"
f_fast_d: "Speculative drafting for models that support it (Qwen3.5, GLM-4) — more tokens per second."
f_priv_tag: "Privacy"
f_priv_t: "Offline by default"
f_priv_d: "Models and chats stay on your device. No account, no ads, optional diagnostics that are off by default, and a clear warning before you ever connect to a server."

# ---------- share this device ----------
net_eyebrow: "Share this device"
net_pill: "new in 2.0"
net_title: "Every device you own,<br><g>one shared brain.</g>"
net_lead: "Your gaming PC has the horsepower. Your phone has you. Turn on <b>Share this device</b> and Llamatik serves your loaded models to your other devices over the local network — found automatically with mDNS."
