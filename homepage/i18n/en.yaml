net_t2: "<b>Hands-off discovery.</b> Nearby Llamatik hosts show up on their own."
net_t3: "<b>Resilient streaming.</b> Drop off Wi-Fi mid-answer and it reconnects and continues."
net_t4: "<b>Android, Desktop and iOS</b> can host. Your battery thanks you."
net_warn: "Connections between devices are currently plain HTTP — keep them on networks you trust."
