# ---------- server ----------
srv_eyebrow: "Llamatik Server"
srv_title: "El teu propi backend d'inferència.<br><g>La mateixa API. Zero canvis de codi.</g>"
srv_lead: "Necessites més potència que un mòbil? Autoallotja un servidor Ktor que parla exactament la mateixa API que la biblioteca — text, embeddings, veu, imatges, <b>vídeo</b> i visió, en streaming per SSE."
srv_t1: "Paritat completa amb <code>LlamaBridge</code>, <code>WhisperBridge</code>, <code>StableDiffusionBridge</code> i <code>MultimodalBridge</code>"
srv_t2: "JSON restringit per esquema, sessions KV, descodificació especulativa, descàrrega a la GPU"
srv_t3: "Autenticació JWT, perfils, a punt per a Docker — o integra <code>com.llamatik:server</code> a la teva pròpia app"
srv_get: "Aconsegueix Llamatik Server"
srv_docs: "Documentació de l'API"

