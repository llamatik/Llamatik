# ---------- features ----------
f_eyebrow: "Què fa"
f_title: "Més que un xatbot.<br><g>Un estudi d'IA complet a la butxaca.</g>"
f_lead: "Text, visió, veu, imatges, vídeo i documents — cadascun amb el motor de confiança de sempre, al maquinari que ja tens."
f_new: "nou"
f_chat_tag: "Xat"
f_chat_t: "Converses ràpides en temps real"
f_chat_d: "Tria qualsevol model GGUF — descarrega'l del catàleg integrat o carrega un fitxer del teu dispositiu. Inclou Markdown, blocs de codi i historial."
f_chat_q: "Explica'm les corrutines de Kotlin com si tingués cinc anys."
f_chat_a: "Imagina una corrutina com una joguina que es pot pausar i reprendre. S'atura quan ha d'esperar — per exemple, per berenar — i continua just on ho havia deixat, així que res més no ha d'aturar-se."
f_vision_tag: "Visió"
f_vision_t: "Ensenya-li una imatge"
f_vision_d: "Pregunta sobre fotos, captures de pantalla i documents amb models de visió al dispositiu com SmolVLM."
f_vision_box1: "tiquet"
f_vision_box2: "total: 42,10"
f_voice_tag: "Veu"
f_voice_t: "Parla, no escriguis"
f_voice_d: "Whisper transcriu la veu sense connexió — amb marques de temps, traducció a l'anglès i torns de parla."
f_video_tag: "Vídeo"
f_video_t: "Text a vídeo, al teu maquinari"
f_video_d: "Descriu una escena i obtén un clip curt — codificat en H.264, desat a la galeria i amb ampliació opcional al dispositiu."
f_image_tag: "Imatges"
f_image_t: "Genera art sense connexió"
f_image_d: "Text a imatge i imatge a imatge, amb progrés en directe i guia ControlNet per a postura, profunditat i vores."
f_agent_tag: "Agents"
f_agent_t: "Un assistent que actua"
f_agent_d: "Planificador, eines, permisos i registre d'auditoria — amb personalitats d'acompanyant des de Professional fins a Mascota."
f_rag_tag: "Documents"
f_rag_t: "Xateja amb els teus PDF"
f_rag_d: "RAG local: fragmentació, embeddings i recuperació MMR — els teus fitxers no es pugen enlloc."
f_fast_tag: "Velocitat"
f_fast_t: "Predicció multitoken"
f_fast_d: "Esborrany especulatiu per als models que ho admeten (Qwen3.5, GLM-4) — més tokens per segon."
f_priv_tag: "Privacitat"
f_priv_t: "Sense connexió per defecte"
f_priv_d: "Els models i els xats es queden al teu dispositiu. Sense compte, sense anuncis, amb diagnòstics opcionals desactivats per defecte i amb un avís clar abans de connectar-te a cap servidor."

# ---------- share this device ----------
net_eyebrow: "Comparteix aquest dispositiu"
net_pill: "nou a la 2.0"
net_title: "Tots els teus dispositius,<br><g>un sol cervell compartit.</g>"
net_lead: "El teu PC de jocs té la potència. El teu mòbil et té a tu. Activa <b>Comparteix aquest dispositiu</b> i Llamatik oferirà els models carregats als teus altres dispositius per la xarxa local — trobats automàticament amb mDNS."
