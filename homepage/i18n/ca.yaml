# ---------- why local-first ----------
why_eyebrow: "Per què en local"
why_title: "La teva IA. Les teves dades. <g>Les teves regles.</g>"
why1_t: "Privat per disseny"
why1_d: "Els prompts, els documents i la veu es processen al teu maquinari. No cal crear cap compte ni confiar en cap núvol."
why2_t: "Funciona a tot arreu"
why2_d: "En un avió, en un soterrani, darrere d'un tallafoc. Quan un model està descarregat, la xarxa és opcional."
why3_t: "Codi obert"
why3_d: "Amb llicència MIT i desenvolupat en obert. Inspecciona'l, bifurca'l, publica'l. Guanyador d'una <k>beca de la Kotlin Foundation 2026</k>."

