net_t3: "<b>Streaming resistent.</b> Si perds el Wi-Fi enmig d'una resposta, es reconnecta i continua."
net_t4: "<b>Android, escriptori i iOS</b> poden fer d'amfitrió. La teva bateria t'ho agrairà."
net_warn: "Les connexions entre dispositius són actualment HTTP sense xifrar — mantén-les en xarxes de confiança."
