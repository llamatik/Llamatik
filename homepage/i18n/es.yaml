# ---------- meta ----------
meta_title: "Llamatik — IA privada que funciona en tu dispositivo"
meta_desc: "Chatea, ve, escucha y crea con una IA que funciona en tus propios dispositivos. Apps gratuitas para Android, iOS, macOS, Windows, Linux y el navegador, además de un SDK de Kotlin de código abierto, un servidor autoalojado y un asistente de programación con IA para tu IDE."
meta_og_desc: "Chat, visión, voz, generación de imágenes y vídeo, todo en tus propios dispositivos. Código abierto. Sin cuenta. Tus prompts nunca salen de tu dispositivo a menos que tú lo decidas."
blog_meta_title: "Blog"
blog_meta_desc: "Novedades, notas de versión y análisis a fondo sobre LLM en el dispositivo con Kotlin."

