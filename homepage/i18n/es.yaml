# ---------- features ----------
f_eyebrow: "Qué hace"
f_title: "Más que un chatbot.<br><g>Un estudio de IA completo en tu bolsillo.</g>"
f_lead: "Texto, visión, voz, imágenes, vídeo y documentos: cada uno con el motor en el que ya confías, en el hardware que ya tienes."
f_new: "nuevo"
f_chat_tag: "Chat"
f_chat_t: "Conversaciones rápidas, en streaming"
f_chat_d: "Elige cualquier modelo GGUF: descárgalo del catálogo integrado o carga un archivo de tu dispositivo. Incluye Markdown, bloques de código e historial."
f_chat_q: "Explícame las corrutinas de Kotlin como si tuviera cinco años."
f_chat_a: "Imagina una corrutina como un juguete que puede hacer pausa y seguir. Se detiene cuando tiene que esperar, por ejemplo para merendar, y retoma justo donde lo dejó, así nadie más tiene que quedarse parado."
f_vision_tag: "Visión"
f_vision_t: "Enséñale una imagen"
f_vision_d: "Pregunta sobre fotos, capturas de pantalla y documentos con modelos de visión en el dispositivo como SmolVLM."
f_vision_box1: "recibo"
f_vision_box2: "total: 42,10"
f_voice_tag: "Voz"
f_voice_t: "Habla, no escribas"
f_voice_d: "Whisper transcribe la voz sin conexión, con marcas de tiempo, traducción al inglés y turnos de cada hablante."
f_video_tag: "Vídeo"
f_video_t: "Texto a vídeo, en tu hardware"
f_video_d: "Describe una escena y obtén un clip corto, codificado en H.264, guardado en tu galería y con escalado opcional en el dispositivo."
f_image_tag: "Imágenes"
f_image_t: "Genera arte sin conexión"
f_image_d: "Texto a imagen e imagen a imagen, con progreso en vivo y guía ControlNet para pose, profundidad y bordes."
f_agent_tag: "Agentes"
f_agent_t: "Un asistente que actúa"
f_agent_d: "Planificador, herramientas, permisos y registro de auditoría, con personalidades de compañero, de Profesional a Mascota."
f_rag_tag: "Documentos"
f_rag_t: "Chatea con tus PDF"
f_rag_d: "RAG local: fragmentación, embeddings y recuperación MMR. Tus archivos nunca se suben."
f_fast_tag: "Velocidad"
f_fast_t: "Predicción multitoken"
f_fast_d: "Borrador especulativo para los modelos compatibles (Qwen3.5, GLM-4): más tokens por segundo."
f_priv_tag: "Privacidad"
f_priv_t: "Sin conexión por defecto"
f_priv_d: "Los modelos y los chats se quedan en tu dispositivo. Sin cuenta, sin anuncios, con diagnósticos opcionales desactivados por defecto y con un aviso claro antes de conectarte a un servidor."

# ---------- share this device ----------
net_eyebrow: "Compartir dispositivo"
net_pill: "nuevo en 2.0"
net_title: "Todos tus dispositivos,<br><g>un cerebro compartido.</g>"
net_lead: "Tu PC gaming tiene la potencia. Tu móvil te tiene a ti. Activa <b>Compartir dispositivo</b> y Llamatik ofrecerá tus modelos cargados al resto de tus dispositivos por la red local, que los encuentran solos con mDNS."
net_t1: "<b>Aprueba cada dispositivo</b> antes de que pueda usar el tuyo, sin secretos compartidos que se puedan filtrar."
net_t2: "<b>Descubrimiento automático.</b> Los hosts de Llamatik cercanos aparecen solos."
net_t3: "<b>Streaming resistente.</b> Si pierdes el Wi-Fi a mitad de una respuesta, se reconecta y continúa."
net_t4: "<b>Android, escritorio e iOS</b> pueden ser anfitriones. Tu batería te lo agradecerá."
net_warn: "Por ahora, las conexiones entre dispositivos usan HTTP sin cifrar: úsalas solo en redes de confianza."
