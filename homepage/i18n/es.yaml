# ---------- server ----------
srv_eyebrow: "Llamatik Server"
srv_title: "Tu propio backend de inferencia.<br><g>Misma API. Cero cambios de código.</g>"
srv_lead: "¿Necesitas más potencia que un móvil? Autoaloja un servidor Ktor que habla exactamente la misma API que la biblioteca: texto, embeddings, voz, imágenes, <b>vídeo</b> y visión, con streaming por SSE."
srv_t1: "Paridad total con <code>LlamaBridge</code>, <code>WhisperBridge</code>, <code>StableDiffusionBridge</code> y <code>MultimodalBridge</code>"
srv_t2: "JSON restringido por esquema, sesiones KV, decodificación especulativa, descarga a GPU"
srv_t3: "Autenticación JWT, perfiles, listo para Docker, o integra <code>com.llamatik:server</code> en tu propia app"
