mdl_meta_title: "Модели — Llamatik"
mdl_eyebrow: "Модели"
mdl_title: "Какую модель <g>выбрать?</g>"
mdl_lead: "Простое руководство по моделям, которые можно запускать в Llamatik: их размер, необходимая память и для чего каждая подходит."
mdl_start_t: "Начните здесь"
mdl_s1_t: "Любой телефон, самый быстрый старт"
mdl_s1_d: "Gemma 3 270M (292 МБ) быстро отвечает даже на старых телефонах и поддерживает много языков."
mdl_s2_t: "Повседневный чат на современном телефоне"
mdl_s2_d: "Gemma 3 1B (806 МБ) — хороший баланс. Для большей глубины на многих языках попробуйте Qwen 3 1.7B (1,8 ГБ)."
mdl_s3_t: "Понимать фото и скриншоты"
mdl_s3_d: "SmolVLM 500M (437 МБ) описывает изображения и читает текст на них. SmolVLM 256M (175 МБ) — самый лёгкий вариант."
mdl_s4_t: "Говорите вместо набора текста"
mdl_s4_d: "Whisper Base q8_0 (82 МБ) — быстрый и точный вариант. Whisper Small q8_0 (264 МБ) лучше справляется с акцентами и шумом."
