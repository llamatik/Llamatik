mdl_ram_note: "Размеры загрузки взяты из каталога приложения и могут меняться. Объём памяти — приблизительная оценка свободной ОЗУ, нужной модели при работе; на практике он зависит от устройства и настроек."
mdl_expect_t: "Чего ожидать"
mdl_expect_d: "Модели, помещающиеся в телефон, небольшие. Они отвечают быстро и приватно, но ошибаются, знают о мире меньше облачных моделей и не умеют искать в интернете. Используйте их для черновиков, пересказов, переводов и идей, а важные факты проверяйте. Большие модели отвечают лучше, но требуют больше памяти."
mdl_byo_t: "Принесите свою модель"
mdl_byo_d: "Приложение также может импортировать любую чат-модель GGUF из ваших файлов или скачать её по ссылке, например с Hugging Face. Крупные модели дают лучшие ответы на ноутбуках и ПК с большим объёмом ОЗУ."
mdl_faq_t: "Вопросы о моделях"
mdl_q1: "Почему первая загрузка такая большая?"
mdl_a1: "Приложение не содержит модель, поэтому остаётся небольшим, а вы сами выбираете, что установить. Модель скачивается один раз и хранится на устройстве."
mdl_q2: "Нужен ли интернет после загрузки модели?"
mdl_a2: "Нет. После загрузки чат, зрение и голос работают офлайн. Подключение нужно только для загрузки моделей и обновлений."
mdl_q3: "С какой модели начать?"
mdl_a3: "На телефоне начните с Gemma 3 270M или Gemma 3 1B. На ноутбуке импортируйте более крупную модель с Hugging Face, когда поймёте, для чего она нужна."
