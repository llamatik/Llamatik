# ---------- why local-first ----------
why_eyebrow: "Por que local primeiro"
why_title: "Sua IA. Seus dados. <g>Suas regras.</g>"
why1_t: "Privado por design"
why1_d: "Prompts, documentos e voz são processados no seu hardware. Não há conta para criar nem nuvem em que confiar."
why2_t: "Funciona em qualquer lugar"
why2_d: "Num avião, num porão, atrás de um firewall. Depois que o modelo é baixado, a rede é opcional."
why3_t: "Código aberto"
why3_d: "Licença MIT e desenvolvido às claras. Inspecione, faça fork, publique. Vencedor de uma <k>Bolsa da Kotlin Foundation 2026</k>."

