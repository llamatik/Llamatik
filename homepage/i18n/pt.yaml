# ---------- server ----------
srv_eyebrow: "Llamatik Server"
srv_title: "Seu próprio backend de inferência.<br><g>Mesma API. Zero mudanças no código.</g>"
srv_lead: "Precisa de mais potência que um celular? Hospede por conta própria um servidor Ktor que fala exatamente a mesma API da biblioteca — texto, embeddings, fala, imagens, <b>vídeo</b> e visão, em streaming via SSE."
srv_t1: "Paridade total com <code>LlamaBridge</code>, <code>WhisperBridge</code>, <code>StableDiffusionBridge</code> e <code>MultimodalBridge</code>"
srv_t2: "JSON restrito por schema, sessões KV, decodificação especulativa, offload para GPU"
srv_t3: "Autenticação JWT, perfis, pronto para Docker — ou incorpore <code>com.llamatik:server</code> no seu próprio app"
srv_get: "Obter o Llamatik Server"
srv_docs: "Docs da API"

