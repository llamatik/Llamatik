# ---------- features ----------
f_eyebrow: "O que ele faz"
f_title: "Mais que um chatbot.<br><g>Um estúdio de IA completo no seu bolso.</g>"
f_lead: "Texto, visão, voz, imagens, vídeo e documentos — tudo rodando no motor em que você já confia, no hardware que você já tem."
f_new: "novo"
f_chat_tag: "Chat"
f_chat_t: "Conversas rápidas, em streaming"
f_chat_d: "Escolha qualquer modelo GGUF — baixe do catálogo integrado ou carregue um arquivo do seu dispositivo. Com Markdown, blocos de código e histórico."
f_chat_q: "Explique corrotinas do Kotlin como se eu tivesse cinco anos."
f_chat_a: "Imagine uma corrotina como um brinquedo que pode pausar e continuar. Ela para quando precisa esperar — tipo para um lanchinho — e retoma exatamente de onde parou, para que o resto não precise ficar parado."
f_vision_tag: "Visão"
f_vision_t: "Mostre uma imagem"
f_vision_d: "Pergunte sobre fotos, capturas de tela e documentos com modelos de visão no dispositivo, como o SmolVLM."
f_vision_box1: "recibo"
f_vision_box2: "total: 42,10"
f_voice_tag: "Voz"
f_voice_t: "Fale, não digite"
f_voice_d: "O Whisper transcreve a fala offline — com marcações de tempo, tradução para inglês e identificação de quem fala."
f_video_tag: "Vídeo"
f_video_t: "Texto para vídeo, no seu hardware"
f_video_d: "Descreva uma cena e receba um clipe curto — codificado em H.264, salvo na sua galeria, com upscaling opcional no dispositivo."
f_image_tag: "Imagens"
f_image_t: "Gere arte offline"
f_image_d: "Texto para imagem e imagem para imagem, com progresso ao vivo e guia ControlNet para pose, profundidade e bordas."
f_agent_tag: "Agentes"
f_agent_t: "Um assistente que age"
f_agent_d: "Planejador, ferramentas, permissões e registro de auditoria — com personas de companhia, de Profissional a Pet."
f_rag_tag: "Documentos"
f_rag_t: "Converse com seus PDFs"
f_rag_d: "RAG local: divisão em trechos, embeddings e recuperação MMR — seus arquivos nunca são enviados."
f_fast_tag: "Velocidade"
f_fast_t: "Predição de múltiplos tokens"
f_fast_d: "Rascunho especulativo para modelos compatíveis (Qwen3.5, GLM-4) — mais tokens por segundo."
f_priv_tag: "Privacidade"
f_priv_t: "Offline por padrão"
f_priv_d: "Modelos e chats ficam no seu dispositivo. Sem conta, sem anúncios, com diagnósticos opcionais desativados por padrão e com um aviso claro antes de você se conectar a um servidor."

# ---------- share this device ----------
net_eyebrow: "Compartilhar este dispositivo"
net_pill: "novo no 2.0"
net_title: "Todos os seus dispositivos,<br><g>um cérebro compartilhado.</g>"
