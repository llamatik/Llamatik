# ---------- meta ----------
meta_title: "Llamatik — IA privada que roda no seu dispositivo"
meta_desc: "Converse, veja, ouça e crie com uma IA que roda nos seus próprios dispositivos. Apps gratuitos para Android, iOS, macOS, Windows, Linux e navegador — além de um SDK Kotlin de código aberto, um servidor próprio e um assistente de programação com IA para a sua IDE."
meta_og_desc: "Chat, visão, voz, geração de imagens e vídeos — rodando nos seus próprios dispositivos. Código aberto. Sem conta. Seus prompts nunca saem do seu dispositivo, a menos que você queira."
blog_meta_title: "Blog"
blog_meta_desc: "Novidades, notas de versão e análises aprofundadas sobre LLMs no dispositivo com foco em Kotlin."

