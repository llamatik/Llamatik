mdl_ram_note: "डाउनलोड आकार ऐप की सूची के हैं, जो समय के साथ बदल सकती है। मेमोरी का आँकड़ा चलते समय मॉडल को चाहिए खाली RAM का मोटा अंदाज़ा है; असली उपयोग आपके डिवाइस और सेटिंग पर निर्भर करता है।"
mdl_expect_t: "क्या उम्मीद रखें"
mdl_expect_d: "फ़ोन में समाने वाले मॉडल छोटे होते हैं। वे तेज़ और निजी तौर पर जवाब देते हैं, लेकिन गलतियाँ करते हैं, क्लाउड मॉडल से कम जानते हैं और वेब पर खोज नहीं कर सकते। इन्हें ड्राफ़्ट, सारांश, अनुवाद और विचार-मंथन के लिए उपयोग करें, और ज़रूरी तथ्यों की जाँच करें। बड़े मॉडल बेहतर जवाब देते हैं पर ज़्यादा मेमोरी और स्टोरेज माँगते हैं।"
mdl_byo_t: "अपना मॉडल लाएँ"
mdl_byo_d: "ऐप आपकी फ़ाइलों से कोई भी GGUF चैट मॉडल इम्पोर्ट कर सकता है या लिंक से डाउनलोड कर सकता है, जैसे Hugging Face से। ज़्यादा RAM वाले लैपटॉप और डेस्कटॉप पर बड़े मॉडल बेहतर जवाब देते हैं।"
mdl_faq_t: "मॉडल के बारे में प्रश्न"
mdl_q1: "पहला डाउनलोड बड़ा क्यों है?"
mdl_a1: "ऐप में कोई मॉडल शामिल नहीं है, इसलिए वह छोटा रहता है और आप तय करते हैं कि क्या इंस्टॉल करना है। मॉडल एक बार डाउनलोड होकर आपके डिवाइस पर रहता है।"
mdl_q2: "मॉडल डाउनलोड करने के बाद क्या इंटरनेट चाहिए?"
mdl_a2: "नहीं। डाउनलोड के बाद चैट, विज़न और आवाज़ ऑफ़लाइन चलते हैं। इंटरनेट केवल मॉडल और अपडेट डाउनलोड करने के लिए चाहिए।"
mdl_q3: "मैं किस मॉडल से शुरू करूँ?"
mdl_a3: "फ़ोन पर Gemma 3 270M या Gemma 3 1B से शुरू करें। लैपटॉप पर, जब आप जान लें कि क्या करना है, तब Hugging Face से बड़ा मॉडल इम्पोर्ट करें।"
foot_models: "मॉडल"
