# ---------- server ----------
srv_eyebrow: "Llamatik Server"
srv_title: "Il tuo backend di inferenza.<br><g>Stessa API. Zero modifiche al codice.</g>"
srv_lead: "Serve più potenza di un telefono? Ospita in autonomia un server Ktor che parla la stessa identica API della libreria — testo, embedding, voce, immagini, <b>video</b> e visione, in streaming via SSE."
srv_t1: "Piena parità con <code>LlamaBridge</code>, <code>WhisperBridge</code>, <code>StableDiffusionBridge</code> e <code>MultimodalBridge</code>"
srv_t2: "JSON vincolato a schema, sessioni KV, decodifica speculativa, offload su GPU"
srv_t3: "Autenticazione JWT, profili, pronto per Docker — oppure integra <code>com.llamatik:server</code> nella tua app"
srv_get: "Scarica Llamatik Server"
srv_docs: "Docs API"

