# ---------- features ----------
f_eyebrow: "Cosa fa"
f_title: "Più di un chatbot.<br><g>Un intero studio di IA in tasca.</g>"
f_lead: "Testo, visione, voce, immagini, video e documenti — ognuno con il motore di cui ti fidi già, sull'hardware che hai già."
f_new: "novità"
f_chat_tag: "Chat"
f_chat_t: "Conversazioni veloci, in streaming"
f_chat_d: "Scegli qualsiasi modello GGUF — scaricalo dal catalogo integrato o carica un file dal tuo dispositivo. Markdown, blocchi di codice e cronologia inclusi."
f_chat_q: "Spiegami le coroutine di Kotlin come se avessi cinque anni."
f_chat_a: "Immagina una coroutine come un giocattolo che può fare pausa e ripartire. Si ferma quando deve aspettare — per esempio per una merenda — e riprende esattamente da dove era rimasto, così nient'altro deve restare fermo."
f_vision_tag: "Visione"
f_vision_t: "Mostrale un'immagine"
f_vision_d: "Fai domande su foto, screenshot e documenti con modelli di visione on-device come SmolVLM."
f_vision_box1: "scontrino"
f_vision_box2: "totale: 42,10"
f_voice_tag: "Voce"
f_voice_t: "Parla, non scrivere"
f_voice_d: "Whisper trascrive il parlato offline — con timestamp, traduzione in inglese e turni di conversazione."
f_video_tag: "Video"
f_video_t: "Da testo a video, sul tuo hardware"
f_video_d: "Descrivi una scena e ottieni una breve clip — codificata in H.264, salvata nella galleria, con upscaling on-device opzionale."
f_image_tag: "Immagini"
f_image_t: "Genera arte offline"
f_image_d: "Da testo a immagine e da immagine a immagine, con avanzamento in tempo reale e guida ControlNet per posa, profondità e contorni."
f_agent_tag: "Agenti"
f_agent_t: "Un assistente che agisce"
f_agent_d: "Pianificatore, strumenti, permessi e registro di audit — con personalità di compagnia da Professionale a Animale domestico."
f_rag_tag: "Documenti"
f_rag_t: "Chatta con i tuoi PDF"
f_rag_d: "RAG locale: suddivisione in blocchi, embedding e recupero MMR — i tuoi file non vengono mai caricati online."
f_fast_tag: "Velocità"
f_fast_t: "Previsione multi-token"
f_fast_d: "Bozza speculativa per i modelli che la supportano (Qwen3.5, GLM-4) — più token al secondo."
f_priv_tag: "Privacy"
f_priv_t: "Offline per impostazione predefinita"
f_priv_d: "Modelli e chat restano sul tuo dispositivo. Nessun account, nessuna pubblicità, diagnostica facoltativa disattivata per impostazione predefinita e un avviso chiaro prima di collegarti a un server."

# ---------- share this device ----------
net_eyebrow: "Condividi questo dispositivo"
net_pill: "novità 2.0"
net_title: "Ogni tuo dispositivo,<br><g>un unico cervello condiviso.</g>"
net_lead: "Il tuo PC da gaming ha la potenza. Il tuo telefono ha te. Attiva <b>Condividi questo dispositivo</b> e Llamatik mette i modelli caricati a disposizione degli altri tuoi dispositivi via rete locale — trovati automaticamente con mDNS."
net_t1: "<b>Approva ogni dispositivo</b> prima che possa usare il tuo — nessun segreto condiviso da far trapelare."
net_t2: "<b>Rilevamento automatico.</b> Gli host Llamatik vicini compaiono da soli."
net_t3: "<b>Streaming resiliente.</b> Se perdi il Wi-Fi a metà risposta, si riconnette e continua."
net_t4: "<b>Android, Desktop e iOS</b> possono fare da host. La tua batteria ringrazia."
net_warn: "Al momento le connessioni tra dispositivi usano HTTP in chiaro — usale solo su reti di cui ti fidi."
