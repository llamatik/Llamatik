# ---------- why local-first ----------
why_eyebrow: "Perché local-first"
why_title: "La tua IA. I tuoi dati. <g>Le tue regole.</g>"
why1_t: "Privata per progetto"
why1_d: "Prompt, documenti e voce vengono elaborati sul tuo hardware. Nessun account da creare e nessun cloud di cui fidarsi."
why2_t: "Funziona ovunque"
why2_d: "In aereo, in cantina, dietro un firewall. Una volta scaricato un modello, la rete è opzionale."
why3_t: "Open source"
why3_d: "Con licenza MIT e sviluppato in pubblico. Ispezionalo, fai un fork, distribuiscilo. Vincitore del <k>Kotlin Foundation Grant 2026</k>."

