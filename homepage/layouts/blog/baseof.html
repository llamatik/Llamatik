<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V6M6PMET69"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V6M6PMET69');
  </script>
  <meta charset="utf-8">
  <script>document.documentElement.classList.add('js')</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Params.meta_title | default .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="theme-color" content="#07070b">
  <link rel="icon" type="image/png" href="{{ "favicon-32x32.png" | relURL }}">
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "blog/index.xml" | relURL }}">
  {{ block "meta_tags" . }}
    {{ with .Params.description }}<meta name="description" content="{{ . }}">{{ end }}
    <meta property="og:title" content="{{ .Params.meta_title | default .Title }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ "images/llamatik-lead-image.png" | absURL }}">
    {{ with .Params.description }}<meta property="og:description" content="{{ . }}">{{ end }}
    <meta name="twitter:card" content="summary_large_image">
  {{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/landing.css" | relURL }}?v=2">
  <link rel="stylesheet" href="{{ "css/blog.css" | relURL }}?v=2">
</head>
<body class="lt blog-page">
{{ partial "lt-nav.html" (dict "blog" true) }}
<main class="blog-main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "lt-footer.html" (dict "blog" true) }}
<script src="{{ "js/blog.js" | relURL }}?v=1" defer></script>
</body>
</html>
