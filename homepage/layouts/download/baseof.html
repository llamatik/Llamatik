<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode }}" dir="{{ .Site.Language.LanguageDirection | default "ltr" }}">
<head>
{{ partial "lt-head.html" (dict "page" . "title" (i18n "dlp_meta_title") "desc" (i18n "dlp_meta_desc") "blog" true) }}
</head>
<body class="lt blog-page dl-page">
{{ partial "lt-nav.html" (dict "page" . "blog" false) }}
<main class="blog-main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "lt-footer.html" (dict "page" . "blog" false) }}
<script src="{{ "js/blog.js" | relURL }}?v=4" defer></script>
<script src="{{ "js/download.js" | relURL }}?v=1" defer></script>
</body>
</html>
